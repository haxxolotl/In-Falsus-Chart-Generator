[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "infalsus-studio"
version = "0.1.0"
description = "Local song-to-chart creation and reversible installation for In Falsus"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2,<3", "scipy>=1.14,<2", "soundfile>=0.13,<1",
  "librosa>=0.11,<1", "joblib>=1.4,<2", "scikit-learn>=1.6,<2",
  "pefile>=2024.8", "unicorn>=2.1,<3", "UnityPy>=1.23,<2",
  "Pillow>=11,<13", "imageio-ffmpeg>=0.6,<1"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
build = ["packaging>=24"]

[project.scripts]
infalsus-studio = "infalsus_studio.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
infalsus_studio = ["assets/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
